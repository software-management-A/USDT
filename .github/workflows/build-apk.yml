
name: Build Sarmaya Plus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Flutter project folders
        run: |
          mkdir -p lib
          mkdir -p assets

          if [ -f main.dart ]; then
            mv main.dart lib/main.dart
          fi

          if [ -f store.dart ]; then
            mv store.dart lib/store.dart
          fi

          if [ -f sarmaya_icon.png ]; then
            cp sarmaya_icon.png assets/sarmaya_icon.png
          fi

          test -f lib/main.dart
          test -f lib/store.dart
          test -f assets/sarmaya_icon.png

      - name: Generate Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name=sarmaya_plus \
            --org=pk.sarmayaplus \
            .

      - name: Set application name
        run: |
          sed -i 's/android:label="sarmaya_plus"/android:label="Sarmaya Plus"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sarmaya-Plus-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
